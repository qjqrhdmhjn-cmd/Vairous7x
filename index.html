<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b0a">
<meta name="robots" content="noindex,nofollow">
<title>Vairous7x | صيانة مؤقتة</title>
<style>
:root{color-scheme:dark;--bg:#070a09;--panel:#0d1410;--line:#294332;--green:#9cff57;--muted:#a9b7ad}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0,#19351f 0,transparent 48%),var(--bg);color:#f1f7f1;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
main{width:min(620px,100%);padding:clamp(28px,6vw,54px);text-align:center;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#111a14,#090e0b);box-shadow:0 0 55px #9cff5714}
.logo{direction:ltr;color:var(--green);font:900 clamp(28px,7vw,44px)/1.2 ui-monospace,monospace;letter-spacing:1px;text-shadow:0 0 20px #9cff5740}
.logo span{color:#ff4057}.status{display:inline-flex;align-items:center;gap:9px;margin:25px 0 10px;padding:7px 14px;border:1px solid #405b43;border-radius:99px;color:var(--green);font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}
h1{font-size:clamp(25px,5vw,36px);margin:12px 0}p{color:var(--muted);line-height:1.9;margin:10px auto;max-width:470px}
small{display:block;margin-top:28px;color:#718578}
</style>
</head>
<body>
<main>
<div class="logo">Vairous7x<span>.</span></div>
<div class="status"><i class="dot"></i> صيانة مؤقتة</div>
<h1>نرجع لكم قريبًا</h1>
<p>نعمل حاليًا على تحديث وتحسين منصة Vairous7x التعليمية. الموقع متوقف مؤقتًا أثناء أعمال الصيانة.</p>
<p>شكرًا لصبركم وثقتكم.</p>
<small>Vairous7x — تعلّم • جرّب • احمِ</small>
</main>
</body>
</html>
